<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Treinos | FT Training</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/painel.css">
</head>
<body class="tv">
  <header class="tv__top">
    <img class="tv__logo" src="/assets/brand/ft-logo-sm.webp" alt="FT Training" width="64" height="42">
    <div class="tv__titulo">
      <p class="mono y">+ Treino do dia</p>
      <h1 id="dia-semana">&nbsp;</h1>
    </div>
    <div class="tv__agora">
      <div class="tv__data" id="data"></div>
      <div class="tv__relogio" id="relogio">--:--</div>
      <div class="tv__outro-dia mono" id="outro-dia" hidden>Prévia · não é hoje</div>
    </div>
  </header>

  <main class="tv__quadro" id="quadro" aria-live="polite"></main>
  <div class="tv__base" aria-hidden="true"></div>
  <p class="tv__status mono" id="status"></p>

  <!-- Na barra fica só o que se usa na TV; o resto vai para o menu, com o nome do que cada opção faz -->
  <nav class="tv__ctl" aria-label="Controles">
    <div class="tv__dias" role="group" aria-label="Trocar o dia">
      <button class="btn btn--ghost" id="anterior" title="Dia anterior (seta ←)" aria-label="Dia anterior">‹</button>
      <button class="btn btn--ghost" id="hoje">Hoje</button>
      <button class="btn btn--ghost" id="proximo" title="Próximo dia (seta →)" aria-label="Próximo dia">›</button>
    </div>
    <button class="btn btn--yellow" id="tela-cheia">Tela cheia</button>
    <button class="tv__menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="tv-menu">
      <span class="tv__listras" aria-hidden="true"><i></i><i></i><i></i></span>Menu
    </button>

    <div class="tv__menu" id="tv-menu" hidden>
      <a class="tv__op" href="/coach">
        <strong>Alunos e treinos</strong>
        <span>Cadastrar alunos e montar os treinos</span>
      </a>
      <a class="tv__op" href="/planilha">
        <strong>Planilha da TV</strong>
        <span>Ligar ou trocar a planilha do Google que aparece aqui</span>
      </a>
      <button class="tv__op" id="margem" type="button">
        <strong>Ajustar bordas da TV <em id="margem-valor">0%</em></strong>
        <span>Use se a TV corta o treino nas beiradas. Cada toque afasta mais</span>
      </button>
      <a class="tv__op" href="/?site">
        <strong>Ver o site</strong>
        <span>Página da FT Training</span>
      </a>
      <button class="tv__op tv__op--sair" id="sair" type="button">
        <strong>Sair da conta</strong>
        <span>A TV volta para a tela de login</span>
      </button>
    </div>
  </nav>

  <script src="/js/treinos.js"></script>
</body>
</html>
