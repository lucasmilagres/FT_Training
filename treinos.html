<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Treinos | FT Training</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/painel.css">
</head>
<body class="tv">
  <header class="tv__top">
    <img class="tv__logo" src="/assets/brand/ft-logo-sm.webp" alt="FT Training" width="64" height="42">
    <div class="tv__titulo">
      <p class="mono y">+ Treino do dia</p>
      <h1 id="dia-semana">&nbsp;</h1>
    </div>
    <div class="tv__agora">
      <div class="tv__data" id="data"></div>
      <div class="tv__relogio" id="relogio">--:--</div>
      <div class="tv__outro-dia mono" id="outro-dia" hidden>Prévia · não é hoje</div>
    </div>
  </header>

  <main class="tv__quadro" id="quadro" aria-live="polite"></main>
  <div class="tv__base" aria-hidden="true"></div>
  <p class="tv__status mono" id="status"></p>

  <nav class="tv__ctl" aria-label="Controles">
    <button class="btn btn--ghost" id="anterior" title="Dia anterior (seta ←)">‹</button>
    <button class="btn btn--ghost" id="hoje">Hoje</button>
    <button class="btn btn--ghost" id="proximo" title="Próximo dia (seta →)">›</button>
    <button class="btn btn--yellow" id="tela-cheia">Tela cheia</button>
    <a class="btn btn--ghost" href="/">Site</a>
    <a class="btn btn--ghost" href="/planilha">Planilha</a>
    <button class="btn btn--ghost" id="sair">Sair</button>
  </nav>

  <script src="/js/treinos.js"></script>
</body>
</html>
