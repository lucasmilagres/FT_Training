<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entrar | FT Training</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/painel.css">
</head>
<body>
  <main class="login">
    <div class="login__card">
      <img class="login__logo" src="/assets/brand/ft-logo-sm.webp" alt="FT Training" width="120" height="79">
      <p class="mono y">+ Área do coach</p>

      <!-- passo 1: e-mail -->
      <section id="passo-email">
        <h1>Entrar</h1>
        <p class="login__lead">Entre com a sua conta Google ou receba um código de acesso no e-mail, sem senha.</p>
        <a class="btn-google" id="entrar-google" href="/api/google/conectar?login=1">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Entrar com Google
        </a>
        <p class="login__erro" id="erro-google" role="alert"></p>
        <p class="login__ou mono"><span>ou receba um código</span></p>
        <form id="form-email" novalidate>
          <label class="mono" for="email">E-mail</label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" required placeholder="seu@email.com">
          <button class="btn btn--yellow" type="submit">Enviar código</button>
          <p class="login__erro" role="alert"></p>
        </form>
      </section>

      <!-- passo 2: código -->
      <section id="passo-codigo" hidden>
        <h1>Confira o e-mail</h1>
        <p class="login__lead">Mandamos um código de 8 dígitos para <b id="email-enviado"></b>. Ele vale por 10 minutos.</p>
        <form id="form-codigo" novalidate>
          <label class="mono" for="codigo">Código</label>
          <input id="codigo" class="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="9" required placeholder="0000 0000">
          <button class="btn btn--yellow" type="submit">Entrar</button>
          <p class="login__erro" role="alert"></p>
          <div class="login__alt">
            <button type="button" class="link" id="trocar">Trocar e-mail</button>
            <button type="button" class="link" id="reenviar">Reenviar código</button>
          </div>
        </form>
      </section>

      <a class="login__voltar mono" href="/">← Voltar ao site</a>
      <p class="login__legal mono"><a href="/privacidade">Privacidade</a> · <a href="/termos">Termos</a> · <a href="/suporte">Suporte</a></p>
    </div>
  </main>
  <script src="/js/entrar.js"></script>
</body>
</html>
